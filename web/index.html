<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نظام إدارة إجازات البناء - مديرية بلدية الهاشمية">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1B3D5E">

  <!-- تثبيت كتطبيق (PWA) على الهاتف والكمبيوتر -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="إجازات البناء">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>إجازات البناء</title>

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    /* شاشة افتتاح فورية (HTML خفيف) تظهر قبل تحميل محرك التطبيق */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #FFFFFF;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      color: #1B3D5E; transition: opacity .35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img {
      width: 96px; height: 96px; border-radius: 50%;
      background: #fff; box-shadow: 0 8px 24px rgba(27,61,94,.18);
    }
    #splash .t { font-size: 22px; font-weight: 700; }
    #splash .s { font-size: 13px; opacity: .8; margin-top: -10px; }
    #splash .bar { width: 140px; height: 4px; border-radius: 4px; background: rgba(27,61,94,.15); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #1B3D5E;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(260%); } 100% { transform: translateX(-120%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="t">إجازات البناء</div>
    <div class="s">مديرية بلدية الهاشمية</div>
    <div class="bar"></div>
  </div>
  <script>
    // ---- تثبيت التطبيق (PWA): نلتقط عرض التثبيت مبكراً قبل تحميل Flutter ----
    var deferredInstall = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredInstall = e;
      window.dispatchEvent(new Event('pwa-installable'));
    });
    window.addEventListener('appinstalled', function () {
      deferredInstall = null;
      window.dispatchEvent(new Event('pwa-installed'));
    });
    window.pwaCanInstall = function () { return !!deferredInstall; };
    window.pwaIsStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };
    window.pwaIsIOS = function () {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    };
    window.pwaInstall = function () {
      if (!deferredInstall) return Promise.resolve('unavailable');
      var p = deferredInstall;
      deferredInstall = null;
      p.prompt();
      return p.userChoice.then(function (r) { return r.outcome; });
    };

    // ---- باركود الإجازة: الرابط …/#p=2026/77 يفتح تفاصيلها بعد تسجيل الدخول ----
    var permitLink = '';
    (function () {
      var m = location.hash.match(/^#p=([^&]+)/);
      if (!m) return;
      permitLink = decodeURIComponent(m[1]);
      history.replaceState(null, '', location.pathname + location.search);
    })();
    window.takePermitLink = function () { var v = permitLink; permitLink = ''; return v; };

    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
