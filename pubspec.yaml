name: building_permits_app
description: >
  نظام إدارة إجازات البناء المؤسسي - Flutter (موبايل + ويندوز)
  مزامنة لحظية عبر Supabase + تخزين محلي Hive (Offline-First)
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- الحالة (State Management) ----
  provider: ^6.1.2

  # ---- التخزين المحلي (Offline-First) ----
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # ---- الاتصال بالشبكة ----
  connectivity_plus: ^6.0.3

  # ---- تشفير محلي (Secure Storage لمفاتيح/توكن الجلسة) ----
  flutter_secure_storage: ^9.2.2

  # ---- الأدوات المساعدة ----
  intl: ^0.20.2
  uuid: ^4.4.0
  equatable: ^2.0.5

  # ---- التصدير والطباعة ----
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6
  open_filex: ^4.5.0
  path: ^1.9.0
  file_picker: ^8.0.5

  # ---- الصور والمرفقات ----
  image_picker: ^1.1.2
  device_info_plus: ^10.1.0

  # ---- التحديث داخل التطبيق (In-App Update) ----
  package_info_plus: ^8.0.0
  dio: ^5.4.0

  # ---- الأيقونات وتأثيرات الواجهة ----
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  mobile_scanner: ^7.3.0
  barcode: ^2.2.9
  web: ^1.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# أيقونة أندرويد = أيقونة تطبيق الويب (PWA): شعار المديرية
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1B3D5E"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

