name: building_permits_app
description: >
  نظام إدارة إجازات البناء المؤسسي - Flutter (موبايل + ويندوز)
  مزامنة لحظية عبر Supabase + تخزين محلي Hive (Offline-First)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- الحالة (State Management) ----
  provider: ^6.1.2

  # ---- الخلفية (Backend) ----
  supabase_flutter: ^2.5.6

  # ---- التخزين المحلي (Offline-First) ----
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # ---- الاتصال بالشبكة ----
  connectivity_plus: ^6.0.3

  # ---- تشفير محلي (Secure Storage لمفاتيح/توكن الجلسة) ----
  flutter_secure_storage: ^9.2.2

  # ---- الأدوات المساعدة ----
  intl: ^0.20.2
  uuid: ^4.4.0
  equatable: ^2.0.5
  google_fonts: ^6.2.1

  # ---- التصدير والطباعة ----
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6
  open_filex: ^4.5.0
  path: ^1.9.0
  share_plus: ^9.0.0
  file_picker: ^8.0.5

  # ---- الصور والمرفقات ----
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  device_info_plus: ^10.1.0

  # ---- الأيقونات وتأثيرات الواجهة ----
  cupertino_icons: ^1.0.6
  glassmorphism: ^3.0.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_icon.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

